name: CI

permissions:
  contents: read

on:
  push:
    branches:
    - main
    paths-ignore:
    - '*.md'
  pull_request:
    paths-ignore:
    - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # native AOT can not cross compile, so every platform Steam runs on gets its own runner
        include:
        - os: windows-latest
          runtime: win-x64
          platform: windows-x64
        - os: ubuntu-latest
          runtime: linux-x64
          platform: linux-x64
        - os: macos-latest
          runtime: osx-arm64
          platform: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-dotnet-cache

    - name: Build
      run: dotnet build --configuration Release CS2WorkshopManager.slnx

    - name: Pack nupkg
      if: matrix.os == 'ubuntu-latest'
      run: dotnet pack --configuration Release CS2WorkshopManager/CS2WorkshopManager.csproj

    - name: Publish CS2WorkshopManager-CLI
      run: dotnet publish --configuration Release --runtime ${{ matrix.runtime }} CLI/CLI.csproj

    - name: Publish CS2WorkshopManager-GUI
      run: dotnet publish --configuration Release --runtime ${{ matrix.runtime }} GUI/GUI.csproj

    - name: Upload nupkg
      uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        name: nupkg
        path: 'CS2WorkshopManager/bin/Release/*.nupkg'

    - name: Upload CS2WorkshopManager-CLI
      uses: actions/upload-artifact@v7
      with:
        name: CS2WorkshopManager-CLI-${{ matrix.platform }}
        path: CLI/bin/Release/${{ matrix.runtime }}/publish

    - name: Upload CS2WorkshopManager-GUI
      uses: actions/upload-artifact@v7
      with:
        name: CS2WorkshopManager-GUI-${{ matrix.platform }}
        path: GUI/bin/Release/${{ matrix.runtime }}/publish
