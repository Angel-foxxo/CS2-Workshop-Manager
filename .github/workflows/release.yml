name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0 or 1.2.0-alpha.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  tag:
    name: Version and tag
    runs-on: ubuntu-latest

    permissions:
      contents: write # push the release commit and tag

    steps:
    - uses: actions/checkout@v7

    - name: Ensure release is running from main
      run: |
        if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
          echo "Releases must run from main. Current ref: ${GITHUB_REF}"
          exit 1
        fi

    - name: Validate release version
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "Invalid semver version: $VERSION"
          exit 1
        fi

    - name: Configure Git author
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Create release commit and tag
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -eux
        # builds between releases are numbered from the last released major.minor
        BASE="$(cut -d. -f1,2 <<< "$VERSION")"
        sed -i "s|<ProjectBaseVersion>.*</ProjectBaseVersion>|<ProjectBaseVersion>${BASE}</ProjectBaseVersion>|" */*.csproj
        git add */*.csproj
        git diff --cached --quiet || git commit -m "chore(release): publish ${VERSION}"
        git tag "v${VERSION}"
        git push origin HEAD:main
        git push origin "v${VERSION}"

  build:
    name: ${{ matrix.os }}
    needs: tag

    strategy:
      fail-fast: false
      matrix:
        # native AOT can not cross compile, so every platform Steam runs on gets its own runner
        include:
        - os: windows-latest
          runtime: win-x64
          artifact: CS2WorkshopUploader-CLI-windows-x64
        - os: ubuntu-latest
          runtime: linux-x64
          artifact: CS2WorkshopUploader-CLI-linux-x64
        - os: macos-latest
          runtime: osx-arm64
          artifact: CS2WorkshopUploader-CLI-macos-arm64

    runs-on: ${{ matrix.os }}

    env:
      VERSION_ARGS: -p:ProjectVersion=${{ inputs.version }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: v${{ inputs.version }}
    - uses: ./.github/actions/setup-dotnet-cache

    - name: Build
      run: dotnet build --configuration Release ${{ env.VERSION_ARGS }} CS2WorkshopUploader.slnx

    - name: Pack nupkg
      if: matrix.os == 'ubuntu-latest'
      run: dotnet pack --configuration Release ${{ env.VERSION_ARGS }} CS2WorkshopUploader/CS2WorkshopUploader.csproj

    - name: Publish CS2WorkshopUploader-CLI
      run: dotnet publish --configuration Release --runtime ${{ matrix.runtime }} ${{ env.VERSION_ARGS }} CLI/CLI.csproj

    - name: Upload nupkg
      uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        name: nupkg
        path: 'CS2WorkshopUploader/bin/Release/*.nupkg'

    - name: Upload CS2WorkshopUploader-CLI
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: CLI/bin/Release/${{ matrix.runtime }}/publish

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the release
      id-token: write # oidc for nuget login

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Create release files
      run: |
       set -eux
       mkdir release
       chmod +x artifacts/CS2WorkshopUploader-CLI-linux-x64/CS2WorkshopUploader-CLI
       chmod +x artifacts/CS2WorkshopUploader-CLI-macos-arm64/CS2WorkshopUploader-CLI
       zip -9j release/CS2WorkshopUploader-CLI-windows-x64.zip artifacts/CS2WorkshopUploader-CLI-windows-x64/*
       zip -9j release/CS2WorkshopUploader-CLI-linux-x64.zip artifacts/CS2WorkshopUploader-CLI-linux-x64/*
       zip -9j release/CS2WorkshopUploader-CLI-macos-arm64.zip artifacts/CS2WorkshopUploader-CLI-macos-arm64/*
       mv artifacts/nupkg/CS2WorkshopUploader.*.nupkg release/CS2WorkshopUploader.nupkg

    - name: Display structure of archived files
      run: ls -Rl
      working-directory: release

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ inputs.version }}
        name: v${{ inputs.version }}
        draft: true
        prerelease: ${{ contains(inputs.version, '-') }}
        generate_release_notes: true
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to NuGet Gallery
      run: dotnet nuget push release/CS2WorkshopUploader.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json"
