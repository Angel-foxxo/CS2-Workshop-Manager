name: Release

# releases the version in Directory.Build.props: bump it there, push, then run this
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  tag:
    name: Version and tag
    runs-on: ubuntu-latest

    permissions:
      contents: write # push the tag

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - uses: actions/checkout@v7

    - name: Ensure release is running from main
      run: |
        if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
          echo "Releases must run from main. Current ref: ${GITHUB_REF}"
          exit 1
        fi

    - name: Read release version
      id: version
      run: |
        VERSION="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props)"
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "Invalid semver version in Directory.Build.props: $VERSION"
          exit 1
        fi
        if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
          echo "v${VERSION} is already released, bump the version in Directory.Build.props first"
          exit 1
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Configure Git author
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Create tag
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -eux
        git tag "v${VERSION}"
        git push origin "v${VERSION}"

  build:
    name: ${{ matrix.os }}
    needs: tag

    strategy:
      fail-fast: false
      matrix:
        # native AOT can not cross compile, so Windows and Linux each get their own runner
        include:
        - os: windows-latest
          runtime: win-x64
          platform: windows-x64
        - os: ubuntu-latest
          runtime: linux-x64
          platform: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: v${{ needs.tag.outputs.version }}
    - uses: ./.github/actions/setup-dotnet-cache

    - name: Build
      run: dotnet build --configuration Release CS2WorkshopManager.slnx

    - name: Pack nupkg
      if: matrix.os == 'ubuntu-latest'
      run: dotnet pack --configuration Release CS2WorkshopManager/CS2WorkshopManager.csproj

    - name: Publish CS2WorkshopManager-CLI
      run: dotnet publish --configuration Release --runtime ${{ matrix.runtime }} CLI/CLI.csproj

    - name: Publish CS2WorkshopManager-GUI
      run: dotnet publish --configuration Release --runtime ${{ matrix.runtime }} GUI/GUI.csproj

    - name: Upload nupkg
      uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        name: nupkg
        path: 'CS2WorkshopManager/bin/Release/*.nupkg'

    - name: Upload CS2WorkshopManager-CLI
      uses: actions/upload-artifact@v7
      with:
        name: CS2WorkshopManager-CLI-${{ matrix.platform }}
        path: CLI/bin/Release/${{ matrix.runtime }}/publish

    - name: Upload CS2WorkshopManager-GUI
      uses: actions/upload-artifact@v7
      with:
        name: CS2WorkshopManager-GUI-${{ matrix.platform }}
        path: GUI/bin/Release/${{ matrix.runtime }}/publish

  publish:
    name: Publish
    needs: [tag, build]
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the release
      id-token: write # oidc for nuget login

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Create release files
      run: |
       set -eux
       mkdir release
       for app in CLI GUI; do
         chmod +x artifacts/CS2WorkshopManager-${app}-linux-x64/CS2WorkshopManager-${app}
         for platform in windows-x64 linux-x64; do
           zip -9j release/CS2WorkshopManager-${app}-${platform}.zip artifacts/CS2WorkshopManager-${app}-${platform}/*
         done
       done
       mv artifacts/nupkg/CS2WorkshopManager.*.nupkg release/CS2WorkshopManager.nupkg

    - name: Display structure of archived files
      run: ls -Rl
      working-directory: release

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ needs.tag.outputs.version }}
        name: v${{ needs.tag.outputs.version }}
        draft: true
        prerelease: ${{ contains(needs.tag.outputs.version, '-') }}
        generate_release_notes: true
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to NuGet Gallery
      run: dotnet nuget push release/CS2WorkshopManager.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json"
